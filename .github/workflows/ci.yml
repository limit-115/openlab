name: CI

on:
    push:
        branches: [main]
    pull_request:

# A newer push makes an older run pointless, so the older one stops rather than finishing into a
# result nobody will read.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        # Long enough for a slow runner, short enough that a hung test fails within the hour
        # instead of holding a runner for the six that GitHub would otherwise allow it.
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - run: pnpm install --frozen-lockfile

            # The same command a developer runs: formatting, types, every test, every build.
            - run: pnpm check

            # The installers are the lab's front door and nothing else reads them. POSIX sh is easy
            # to get subtly wrong, and getting it wrong here means an operator who cannot install.
            - name: Lint the shell scripts
              run: shellcheck --shell=sh apps/landing/public/install.sh release/verify-release.sh

    # Every platform is cross-compiled from one machine, which is how a release is cut, so this is
    # built the same way rather than once per runner. Windows in particular cannot build its own:
    # its archive is a zip, and `zip` is not a thing a Windows runner has.
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - run: pnpm install --frozen-lockfile

            # The four targets that have a runner to be run on. A release builds all five; the one
            # left out is darwin-x64, for which the hosted macOS images are no longer Intel.
            - run: pnpm release linux-x64 linux-arm64 darwin-arm64 windows-x64

            - uses: actions/upload-artifact@v7
              with:
                  name: release
                  path: release/dist/
                  retention-days: 3

    # A compiled lab can break while the sources still pass, because the runtime a release carries
    # is not the one the tests ran on — and it breaks per platform. Until this ran, four of the five
    # binaries a release publishes had never been started by anyone before an operator started them.
    #
    # darwin-x64 is the one still in that position: the hosted macOS images are arm64, so it is
    # cross-compiled the same way as the four below and published unstarted.
    verify:
        needs: build
        strategy:
            # One platform failing is a fact about that platform, and stopping the others hides
            # whether it is the only one.
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: linux-x64
                    - os: ubuntu-24.04-arm
                      target: linux-arm64
                    - os: macos-latest
                      target: darwin-arm64
                    - os: windows-latest
                      target: windows-x64
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v8
              with:
                  name: release
                  path: release/dist

            # Git Bash is on the Windows runner, so one script drives all three platforms rather
            # than one script per shell that would then differ in what it checks.
            - name: Install, update and run the release
              shell: bash
              run: sh release/verify-release.sh ${{ matrix.target }}
