name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - run: pnpm install --frozen-lockfile

            - run: pnpm check

            - name: Lint the shell scripts
              run: shellcheck --shell=sh apps/landing/public/install.sh release/verify-release.sh

    # Compiling five platforms and then starting each one costs more than every other job here put
    # together, and a macOS runner bills ten minutes for each one it takes. A pull request gets the
    # checks instead, and the release itself is built and driven on every push to main. `verify`
    # needs this job, so leaving it out leaves that out too.
    build:
        if: github.event_name != 'pull_request'
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - run: pnpm install --frozen-lockfile

            - run: pnpm release linux-x64 linux-arm64 darwin-arm64 windows-x64

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: release
                  path: release/dist/
                  retention-days: 3

    verify:
        needs: build
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: linux-x64
                    - os: blacksmith-4vcpu-ubuntu-2404-arm
                      target: linux-arm64
                    - os: macos-latest
                      target: darwin-arm64
                    - os: windows-latest
                      target: windows-x64
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: release
                  path: release/dist

            - name: Install, update and run the release
              shell: bash
              run: sh release/verify-release.sh ${{ matrix.target }}
