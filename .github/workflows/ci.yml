name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - run: pnpm install --frozen-lockfile

            - run: pnpm check

            - name: Lint the shell scripts
              run: shellcheck --shell=sh apps/landing/public/install.sh release/verify-release.sh

    build:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - run: pnpm install --frozen-lockfile

            - run: pnpm release linux-x64 linux-arm64 darwin-arm64 windows-x64

            - uses: actions/upload-artifact@v7
              with:
                  name: release
                  path: release/dist/
                  retention-days: 3

    verify:
        needs: build
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: linux-x64
                    - os: blacksmith-4vcpu-ubuntu-2404-arm
                      target: linux-arm64
                    - os: macos-latest
                      target: darwin-arm64
                    - os: windows-latest
                      target: windows-x64
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@v8
              with:
                  name: release
                  path: release/dist

            - name: Install, update and run the release
              shell: bash
              run: sh release/verify-release.sh ${{ matrix.target }}
