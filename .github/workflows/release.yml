name: Release

on:
    push:
        tags:
            - "v*"
    # Run by hand to rehearse: everything builds and verifies, nothing publishes.
    workflow_dispatch:

# Never cancel a release run: stopping one partway is how it ends up half published.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 40
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: The tag and the version must agree
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  tagged="${GITHUB_REF_NAME#v}"
                  stated="$(node -p "require('./apps/cli/package.json').version")"
                  if [ "$tagged" != "$stated" ]; then
                      echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/cli/package.json version ${stated}"
                      exit 1
                  fi

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - run: pnpm install --frozen-lockfile

            - name: Verify
              run: pnpm check

            - name: Build every platform
              run: pnpm release

            - name: Sign the manifest
              env:
                  OPENLAB_SIGNING_KEY: ${{ secrets.OPENLAB_SIGNING_KEY }}
              run: pnpm sign-release

            - name: Attest what was built
              if: startsWith(github.ref, 'refs/tags/v')
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: release/dist/openlab-*

            - uses: actions/upload-artifact@v7
              with:
                  name: release
                  path: release/dist/
                  retention-days: 7

    verify:
        needs: build
        strategy:
            fail-fast: false
            matrix:
                # darwin-x64 has no hosted runner: it ships cross-compiled and never started here.
                include:
                    - os: ubuntu-latest
                      target: linux-x64
                    - os: blacksmith-4vcpu-ubuntu-2404-arm
                      target: linux-arm64
                    - os: macos-latest
                      target: darwin-arm64
                    - os: windows-latest
                      target: windows-x64
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@v8
              with:
                  name: release
                  path: release/dist

            - name: Install, update and run the release
              shell: bash
              run: sh release/verify-release.sh ${{ matrix.target }}

    publish:
        needs: verify
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/download-artifact@v8
              with:
                  name: release
                  path: release/dist

            - name: Write the release notes
              id: notes
              uses: orhun/git-cliff-action@v4
              with:
                  config: cliff.toml
                  args: --latest --strip all
              env:
                  OUTPUT: release-notes.md

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${GITHUB_REF_NAME}" \
                      --title "${GITHUB_REF_NAME}" \
                      --verify-tag \
                      --notes-file "${{ steps.notes.outputs.changelog }}" \
                      release/dist/openlab-* \
                      release/dist/manifest.json \
                      release/dist/manifest.json.sig \
                      apps/landing/public/install.sh \
                      apps/landing/public/install.ps1 \
                      apps/landing/public/install.cmd
