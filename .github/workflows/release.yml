name: Release

on:
    push:
        tags:
            - "v*"
    # Run by hand to rehearse: everything builds and verifies, nothing publishes.
    workflow_dispatch:

# Never cancel a release run: stopping one partway is how it ends up half published.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 40
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: The tag and the version must agree
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  tagged="${GITHUB_REF_NAME#v}"
                  stated="$(node -p "require('./apps/cli/package.json').version")"
                  if [ "$tagged" != "$stated" ]; then
                      echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/cli/package.json version ${stated}"
                      exit 1
                  fi

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - run: pnpm install --frozen-lockfile

            - name: Verify
              run: pnpm check

            - name: Build every platform
              run: pnpm release

            - name: Sign the manifest
              env:
                  OPENLAB_SIGNING_KEY: ${{ secrets.OPENLAB_SIGNING_KEY }}
              run: pnpm sign-release

            # Attesting a private repository needs Enterprise, and this one is on a plan that has
            # no such thing. Left ungated, the first tag dies here — after the archives were built
            # and the manifest signed, on the one step no rehearsal ever reaches.
            - name: Attest what was built
              if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: release/dist/openlab-*

            # Skipping it quietly is how a release ships without provenance and nobody finds out
            # until somebody tries to verify one.
            - name: Say that this release carries no provenance
              if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private
              run: |
                  echo "::warning title=Nothing was attested::${GITHUB_REF_NAME} was built in a private repository, where attesting needs Enterprise. gh attestation verify will find nothing for these archives."

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: release
                  path: release/dist/
                  retention-days: 7

    verify:
        needs: build
        strategy:
            fail-fast: false
            matrix:
                # darwin-x64 has no hosted runner: it ships cross-compiled and never started here.
                include:
                    - os: ubuntu-latest
                      target: linux-x64
                    - os: blacksmith-4vcpu-ubuntu-2404-arm
                      target: linux-arm64
                    - os: macos-latest
                      target: darwin-arm64
                    - os: windows-latest
                      target: windows-x64
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: release
                  path: release/dist

            - name: Install, update and run the release
              shell: bash
              run: sh release/verify-release.sh ${{ matrix.target }}

    publish:
        needs: verify
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: release
                  path: release/dist

            - name: Write the release notes
              id: notes
              uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
              with:
                  config: cliff.toml
                  args: --latest --strip all
              env:
                  OUTPUT: release-notes.md

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${GITHUB_REF_NAME}" \
                      --title "${GITHUB_REF_NAME}" \
                      --verify-tag \
                      --notes-file "${{ steps.notes.outputs.changelog }}" \
                      release/dist/openlab-* \
                      release/dist/manifest.json \
                      release/dist/manifest.json.sig \
                      apps/landing/public/install.sh \
                      apps/landing/public/install.ps1 \
                      apps/landing/public/install.cmd
