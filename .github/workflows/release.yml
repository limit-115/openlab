name: Release

# A release is cut by pushing a tag. Everything is compiled on one machine, because Bun
# cross-compiles every platform the lab is built for, including Windows.
on:
    push:
        tags:
            - "v*"
    # Run by hand to build and verify every artifact without publishing any of them, which is how a
    # release is rehearsed. Only a tag publishes.
    workflow_dispatch:

# Two tags pushed in quick succession must not race each other into the same release page. Unlike
# CI, an in-flight run is never cancelled: stopping one partway through is how a release ends up
# half published.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        # Five platforms and the full suite, so this is roomier than CI, and still bounded.
        timeout-minutes: 40
        permissions:
            contents: read
            # What signs the provenance attestation binding these artifacts to this workflow.
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v7

            # The version is read from the manifest rather than from the tag, so a tag that says
            # something else would publish artifacts named after a version nobody asked for. They
            # are compared here, before anything is built.
            - name: The tag and the version must agree
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  tagged="${GITHUB_REF_NAME#v}"
                  stated="$(node -p "require('./apps/cli/package.json').version")"
                  if [ "$tagged" != "$stated" ]; then
                      echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/cli/package.json version ${stated}"
                      exit 1
                  fi

            # pnpm comes first because the Node cache below is keyed on its lockfile, and the
            # version it installs is the one `packageManager` pins rather than one named here.
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - run: pnpm install --frozen-lockfile

            # A release that fails its own suite is not a release. This is the same command a
            # developer runs, so nothing is verified here that is not verified before a commit.
            - name: Verify
              run: pnpm check

            - name: Build every platform
              run: pnpm release

            # The digests inside the manifest prove an archive is the one described. This is what
            # proves the description, and without it a substituted channel passes every check a lab
            # makes. A rehearsal signs too, so a key that no released lab trusts fails here rather
            # than on the machine of whoever tries to update off the release it signed.
            - name: Sign the manifest
              env:
                  OPENLAB_SIGNING_KEY: ${{ secrets.OPENLAB_SIGNING_KEY }}
              run: pnpm sign-release

            # The archives are built from sources this workflow checked out, and the attestation is
            # what lets anyone confirm that afterwards with `gh attestation verify`. Only a
            # published archive is worth attesting: signing a rehearsal's would put a permanent
            # record in the transparency log for a file that is deleted minutes later.
            - name: Attest what was built
              if: startsWith(github.ref, 'refs/tags/v')
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: release/dist/openlab-*

            - uses: actions/upload-artifact@v7
              with:
                  name: release
                  path: release/dist/
                  retention-days: 7

    # Nothing is published that has not been started. This is the same script CI runs, so a release
    # is checked the way every pull request was and not by a second, weaker copy of the idea.
    #
    # darwin-x64 is the one target with no runner to be run on: the hosted macOS images are arm64.
    # It is cross-compiled the same way as the four below and published unstarted, and saying so
    # here is the only honest way to leave it.
    verify:
        needs: build
        strategy:
            # One platform failing is a fact about that platform, and stopping the others hides
            # whether it is the only one.
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: linux-x64
                    - os: ubuntu-24.04-arm
                      target: linux-arm64
                    - os: macos-latest
                      target: darwin-arm64
                    - os: windows-latest
                      target: windows-x64
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v7
              with:
                  name: release
                  path: release/dist

            # Git Bash is on the Windows runner, so one script drives all four platforms rather
            # than one script per shell that would then differ in what it checks.
            - name: Install, update and run the release
              shell: bash
              run: sh release/verify-release.sh ${{ matrix.target }}

    publish:
        needs: verify
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            # The whole history, because the release notes are written from it.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/download-artifact@v7
              with:
                  name: release
                  path: release/dist

            # Written from the conventional commits since the last tag, grouped by what each change
            # was, rather than from raw subject lines in the order they happened.
            - name: Write the release notes
              id: notes
              uses: orhun/git-cliff-action@v4
              with:
                  config: cliff.toml
                  args: --latest --strip all
              env:
                  OUTPUT: release-notes.md

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${GITHUB_REF_NAME}" \
                      --title "${GITHUB_REF_NAME}" \
                      --notes-file "${{ steps.notes.outputs.changelog }}" \
                      release/dist/openlab-* \
                      release/dist/manifest.json \
                      release/dist/manifest.json.sig \
                      apps/landing/public/install.sh \
                      apps/landing/public/install.ps1 \
                      apps/landing/public/install.cmd
