# How a release turns its commits into something a person wants to read.
#
# Every commit here is a conventional commit, which until now bought nothing: the release page was
# generated by GitHub from raw subject lines. This is what spends that discipline.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking** {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = true

# Formatting, chores, tests and CI plumbing changed nothing an operator can observe, so they are
# left out of what an operator reads.
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Faster" },
    { message = "^refactor", group = "Changed" },
    { message = "^build", group = "Changed" },
    { message = "^docs", group = "Documented" },
    { message = "^revert", group = "Reverted" },
    { message = "^style|^chore|^test|^ci", skip = true }
]
